<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tikam Flow</title>
<style>
:root{--bg:#0d0709;--panel:rgba(20,14,18,.72);--line:rgba(255,255,255,.12);--text:#f3e9e4;--mute:#a8999a;--acc:#ff8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "Avenir Next","Helvetica Neue",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#gear{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:18px;transition:opacity .5s}
#panel{position:fixed;right:16px;top:calc(64px + env(safe-area-inset-top,0px));width:272px;max-width:calc(100vw - 32px);max-height:calc(100% - 90px);overflow:auto;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:opacity .5s,transform .3s}
#panel.off{opacity:0;pointer-events:none;transform:translateY(-6px)}
body.idle #gear,body.idle #panel{opacity:0;pointer-events:none}body.idle{cursor:none}
h1{font-size:17px;font-weight:600;margin:0 0 2px;letter-spacing:.02em}
.sub{margin:0 0 14px;color:var(--mute);font-size:12px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.grid button{padding:8px 0;border:1px solid var(--line);border-radius:10px;background:none;color:var(--mute);cursor:pointer;font:inherit}
.grid button.on{background:rgba(255,138,76,.18);color:var(--text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.row>label,.lbl{color:var(--mute)}
.lbl{display:block;margin:0 0 6px}
input[type=color]{width:44px;height:28px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
input[type=range]{width:140px;accent-color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px}
.seg button{flex:1;padding:8px 0;background:none;border:0;color:var(--mute);cursor:pointer;font:inherit}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:rgba(255,138,76,.18);color:var(--text)}
.pre{display:flex;gap:8px;margin:0 0 14px}
.pre button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--text);cursor:pointer;font:inherit}
.hint{color:var(--mute);margin:12px 0 0;font-size:12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="gear" aria-label="Настройки">⚙</button>
<div id="panel" class="off">
  <h1>Tikam Flow</h1>
  <p class="sub">Живые обои с лава-лампой</p>
  <span class="lbl">Положение лампы</span>
  <div class="seg" id="pos"><button data-p="0.22">Слева</button><button data-p="0.5">По центру</button><button data-p="0.78">Справа</button></div>
  <span class="lbl">Форма лампы</span>
  <div class="grid" id="shp"><button data-s="0">Классика</button><button data-s="1">Цилиндр</button><button data-s="2">Колба</button><button data-s="3">Ваза</button></div>
  <div class="row"><label for="ny">🎄 Новогодний режим</label><input type="checkbox" id="ny"></div>
  <span class="lbl">Готовые схемы</span>
  <div class="pre" id="pre"></div>
  <div class="row"><label for="lava">Цвет лавы</label><input type="color" id="lava"></div>
  <div class="row"><label for="glow">Цвет свечения</label><input type="color" id="glow"></div>
  <div class="row"><label for="bg">Цвет фона</label><input type="color" id="bg"></div>
  <div class="row"><label for="gi">Яркость свечения</label><input type="range" id="gi" min="0.2" max="2" step="0.05"></div>
  <div class="row"><label for="sp">Скорость</label><input type="range" id="sp" min="0.2" max="3" step="0.05"></div>
  <div class="row"><label for="sz">Размер лампы</label><input type="range" id="sz" min="0.6" max="1.1" step="0.01"></div>
  <div class="btns"><button id="fs">Во весь экран</button><button id="rs">Сбросить</button></div>
  <p class="hint">Клавиша H скрывает панель. При бездействии интерфейс исчезает сам.</p>
</div>
<script>
const PRESETS=[
 {n:'Классика',lava:'#ff3b2f',glow:'#ff7a2e',bg:'#1b0a10'},
 {n:'Океан',lava:'#22d3ee',glow:'#2b7bff',bg:'#050d1c'},
 {n:'Фиолет',lava:'#c14dff',glow:'#ff4fa3',bg:'#12061f'},
 {n:'Кислота',lava:'#9dff3a',glow:'#2fe08a',bg:'#07140c'},
 {n:'Золото',lava:'#ffc02e',glow:'#ff8a1f',bg:'#150d05'}];
const DEF={pos:0.5,lava:PRESETS[0].lava,glow:PRESETS[0].glow,bg:PRESETS[0].bg,gi:1,sp:1,sz:0.85,shape:0,ny:false};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('lava-lamp')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lava-lamp',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);

const cv=$('c'),gl=cv.getContext('webgl',{antialias:false,alpha:false});
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform vec2 R;uniform float T,cx,gI,sz,shp,ny;uniform vec3 lava,glow,bg;uniform vec3 B[12];
float gw(float t){t=clamp(t,0.,1.);
 if(shp<0.5)return mix(0.095,0.052,pow(t,0.85));
 if(shp<1.5)return 0.078;
 if(shp<2.5)return 0.045+0.08*pow(1.-t,1.8);
 return 0.06+0.055*sin(3.14159*pow(t,0.9));}
float hwAll(float y){
 if(y<0.22)return mix(0.15,gw(0.),pow(clamp(y/0.22,0.,1.),0.7));
 if(y<0.88)return gw((y-0.22)/0.66);
 float w=gw(1.),s=clamp((y-0.91)/0.09,0.,1.);return w*sqrt(1.-s*s);}
float field(vec2 q){float f=0.;for(int i=0;i<12;i++){vec2 d=q-B[i].xy;f+=B[i].z*B[i].z/(dot(d,d)+1e-4);}return f;}
float sdU(vec2 p,vec2 a,vec2 b,float ra,float rb){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-mix(ra,rb,h);}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
 vec2 p=gl_FragCoord.xy;float Lh=R.y*sz;vec2 o=vec2(cx,R.y*0.5-Lh*0.42);
 vec2 q=(p-o)/Lh;
 float breath=0.94+0.06*sin(T*0.7)+0.02*sin(T*2.3);
 float v=length((p/R-vec2(0.5))*vec2(1.15,1.));
 vec3 col=bg*(1.15-v*0.95);
 float dg=length(vec2(q.x,max(0.,abs(q.y-0.52)-0.25)));
 float halo=0.30*exp(-dg*2.6)+0.55*exp(-dg*7.)+0.7*exp(-dg*20.);
 col+=glow*halo*gI*breath*0.85;
 // floor / desk
 if(q.y<0.){
  float fy=-q.y;
  vec3 fl=bg*0.35*(1.1-v*0.6);
  float rx=exp(-pow(q.x*2.2,2.))*exp(-fy*9.);
  float wide=exp(-abs(q.x)*3.)*exp(-fy*4.);
  fl+=glow*gI*breath*(0.55*rx+0.18*wide);
  fl*=1.-0.6*exp(-pow(q.x/0.17,2.))*exp(-fy*40.);
  col=mix(col,fl,smoothstep(0.,0.004,fy));
  col+=glow*gI*0.12*exp(-fy*120.)*exp(-abs(q.x)*3.);
 }
 // lamp
 if(q.y>0.&&q.y<1.){
  float m=hwAll(q.y);float ax=abs(q.x);
  float aa=1.5/Lh;float cover=smoothstep(0.,aa,m-ax);
  if(cover>0.){
   float nx=q.x/m;vec3 c;
   if(q.y<0.22||q.y>0.88){
    float b=0.22+0.55*pow(1.-abs(nx),0.8)+0.5*pow(max(0.,1.-abs(nx+0.45)*3.),2.);
    c=vec3(0.15,0.14,0.16)*b*1.6;
    float leak=q.y<0.22?smoothstep(0.12,0.22,q.y):smoothstep(0.96,0.88,q.y);
    c+=glow*gI*breath*0.32*leak*(1.-0.5*abs(nx));
    c+=vec3(1.)*0.07*smoothstep(0.1,0.0,abs(nx+0.55))*0.5;
    if(q.y<0.22)c*=0.85+0.15*smoothstep(0.0,0.1,q.y);
   }else{
    float yy=q.y;float heat=exp(-(yy-0.22)*3.2);
    vec3 liq=glow*gI*breath*(0.22+0.55*heat)*(0.8+0.4*(1.-abs(nx)*abs(nx)));
    liq+=lava*0.06;
    float f=field(q);float e=0.003;
    vec2 g=vec2(field(q+vec2(e,0.))-field(q-vec2(e,0.)),field(q+vec2(0.,e))-field(q-vec2(0.,e)));
    // soft inner glow around blobs
    liq+=lava*gI*0.35*smoothstep(0.35,1.0,f)*breath;
    float body=smoothstep(0.96,1.04,f);
    float tilt=1.-smoothstep(1.,2.6,f);
    vec3 n=normalize(vec3(-normalize(g+1e-5)*tilt*0.95,1.));
    vec3 L=normalize(vec3(-0.5,0.4,0.8));
    float dif=max(dot(n,L),0.);
    float up=max(dot(n,normalize(vec3(0.,-1.,0.6))),0.);
    vec3 hv=normalize(L+vec3(0.,0.,1.));float sp=pow(max(dot(n,hv),0.),48.);
    float core=smoothstep(1.,4.,f);
    vec3 lc=lava*(0.45+0.55*dif)+lava*glow*0.0;
    lc+=lava*(0.5+0.9*heat)*gI*(0.55+0.45*core);
    lc+=glow*gI*0.35*up*(0.4+heat);
    lc+=vec3(1.,.9,.85)*sp*0.55;
    lc+=mix(lava,vec3(1.),0.6)*pow(1.-n.z,2.)*0.25;
    c=mix(liq,lc,body);
    // glass shading
    c*=1.-0.55*pow(abs(nx),3.);
    float yf=smoothstep(0.22,0.4,yy)*smoothstep(0.88,0.72,yy);
    c+=vec3(1.)*0.22*smoothstep(0.13,0.0,abs(nx+0.6))*(0.35+0.65*yf);
    c+=vec3(1.)*0.07*smoothstep(0.06,0.0,abs(nx-0.7))*yf;
    c+=glow*0.18*pow(abs(nx),5.)*gI;
   }
   col=mix(col,c,cover);
  }
 }
 if(ny>0.5){
  float px=1.5/Lh;float Y0=0.25,Y1=0.85,A=41.9,PH=0.6;
  if(q.y>0.2&&q.y<0.9&&abs(q.x)<0.3){
   float R0=hwAll(q.y)+0.006;
   float th=A*(q.y-Y0)+PH;float sn=sin(th),cs=cos(th);
   float k=R0*A*cs;
   float perp=abs(q.x-R0*sn)/sqrt(1.+k*k);
   float t0=0.0032;
   float lim=smoothstep(Y0-0.004,Y0,q.y)*smoothstep(Y1+0.004,Y1,q.y);
   float wa=smoothstep(t0+px,t0-px,perp)*lim;
   vec3 wc=vec3(0.05,0.36,0.17)*(0.7+0.4*sin(q.y*700.))*(1.15-0.45*perp/t0);
   if(cs<0.)wc*=0.45;
   col=mix(col,wc+glow*0.03,wa*(cs>0.?1.:0.6));
   for(int i=0;i<20;i++){
    float fi=float(i);float yk=Y0+0.015+fi*0.0295;
    float tk=A*(yk-Y0)+PH;
    vec2 bp=vec2((hwAll(yk)+0.006)*sin(tk),yk);
    float d=length(q-bp);
    if(d<0.08){
     float m4=mod(fi,4.);
     vec3 bc=m4<0.5?vec3(1.,.15,.12):(m4<1.5?vec3(1.,.72,.18):(m4<2.5?vec3(.25,1.,.45):vec3(.3,.6,1.)));
     float tw=0.72+0.28*sin(T*2.2+fi*1.9);
     float fb=cos(tk)>0.?1.:0.4;
     float core=smoothstep(0.011,0.006,d)*fb;
     float hal=exp(-d*d/0.0006)*0.55+exp(-d*d/0.004)*0.14;
     col+=bc*hal*tw*fb*1.4;
     col=mix(col,bc*(1.2+0.9*tw),core);
    }
   }
  }
 }
 col=1.-exp(-col*1.3);
 col+=(hash(p+fract(T))-0.5)/200.;
 gl_FragColor=vec4(col,1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);const uR=U('R'),uT=U('T'),uCx=U('cx'),uGI=U('gI'),uSz=U('sz'),uShp=U('shp'),uNy=U('ny'),uL=U('lava'),uG=U('glow'),uB=U('bg'),uBl=U('B');

function resize(){const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',resize);resize();

// physics (lamp-local coordinates)
const YLO=0.22,YHI=0.88;
const hwG=y=>{const t=Math.min(1,Math.max(0,(y-0.22)/0.66)),s=S.shape;return s===1?0.078:s===2?0.045+0.08*Math.pow(1-t,1.8):s===3?0.06+0.055*Math.sin(Math.PI*Math.pow(t,0.9)):0.095-0.043*Math.pow(t,0.85)};
const blobs=[];const RS=[0.05,0.042,0.036,0.03,0.045,0.034,0.04,0.028,0.038];
for(let i=0;i<9;i++)blobs.push({x:(Math.random()-.5)*0.06,y:YLO+0.05+Math.random()*0.55,r:RS[i],vy:0,t:Math.random(),s:Math.random()*10});
const arr=new Float32Array(36);
function step(dt,time,sp){
 dt*=sp;
 for(const b of blobs){
  const bottom=b.y<YLO+0.12,top=b.y>YHI-0.14;
  if(bottom)b.t+=dt*(0.14+0.1*Math.sin(b.s));
  else if(top)b.t-=dt*0.2;
  else b.t+=dt*(b.vy>0?-0.012:0.012);
  b.t=Math.min(1,Math.max(0,b.t));
  b.vy+=((b.t-0.5)*0.11-b.vy*1.4)*dt;
  b.y+=b.vy*dt;
  b.x+=Math.sin(time*0.35*sp+b.s*5)*0.006*dt;
  const lo=YLO+b.r*0.75,hi=YHI-b.r*0.8;
  if(b.y<lo){b.y=lo;if(b.vy<0)b.vy=0}
  if(b.y>hi){b.y=hi;if(b.vy>0)b.vy=0}
  const lim=Math.max(0,hwG(b.y)-b.r*0.7);b.x=Math.max(-lim,Math.min(lim,b.x));
 }
 blobs.forEach((b,i)=>{arr[i*3]=b.x;arr[i*3+1]=b.y;arr[i*3+2]=b.r});
 const pool=[[-0.045,0.04],[0.0,0.058],[0.045,0.04]];
 for(let k=0;k<3;k++){const i=9+k;arr[i*3]=pool[k][0]+0.006*Math.sin(time*0.5*sp+k*2);arr[i*3+1]=YLO+0.005+0.004*Math.sin(time*0.6*sp+k);arr[i*3+2]=pool[k][1]*(1+0.04*Math.sin(time*0.4*sp+k*3))}
}
for(let i=0;i<60;i++)step(0.2,i*0.2,1); // warm start

let cx=S.pos,last=performance.now(),time=0;
function frame(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
 step(dt,time,S.sp);
 cx+=(S.pos-cx)*Math.min(1,dt*3.5);
 gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,time);gl.uniform1f(uCx,cx*cv.width);
 gl.uniform1f(uGI,S.gi);gl.uniform1f(uSz,S.sz);gl.uniform1f(uShp,S.shape);gl.uniform1f(uNy,S.ny?1:0);
 gl.uniform3fv(uL,hex(S.lava));gl.uniform3fv(uG,hex(S.glow));gl.uniform3fv(uB,hex(S.bg));
 gl.uniform3fv(uBl,arr);
 gl.drawArrays(gl.TRIANGLES,0,3);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// UI
function sync(){
 for(const k of['lava','glow','bg'])$(k).value=S[k];
 $('gi').value=S.gi;$('sp').value=S.sp;$('sz').value=S.sz;
 document.querySelectorAll('#pos button').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.p-S.pos)<0.01));
 document.querySelectorAll('#shp button').forEach(b=>b.classList.toggle('on',+b.dataset.s===S.shape));
 $('ny').checked=!!S.ny;
}
document.querySelectorAll('#pos button').forEach(b=>b.onclick=()=>{S.pos=+b.dataset.p;sync();save()});
document.querySelectorAll('#shp button').forEach(b=>b.onclick=()=>{S.shape=+b.dataset.s;sync();save()});
$('ny').onchange=e=>{S.ny=e.target.checked;save()};
PRESETS.forEach(p=>{const b=document.createElement('button');b.title=p.n;b.setAttribute('aria-label',p.n);b.style.background=`radial-gradient(circle at 35% 35%,${p.lava},${p.glow})`;b.onclick=()=>{S.lava=p.lava;S.glow=p.glow;S.bg=p.bg;sync();save()};$('pre').appendChild(b)});
for(const k of['lava','glow','bg'])$(k).oninput=e=>{S[k]=e.target.value;save()};
for(const k of['gi','sp','sz'])$(k).oninput=e=>{S[k]=+e.target.value;save()};
$('gear').onclick=()=>$('panel').classList.toggle('off');
$('rs').onclick=()=>{S=Object.assign({},DEF);sync();save()};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')$('panel').classList.add('off')});
let idle;const wake=()=>{document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('idle'),4000)};
['mousemove','pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,wake));wake();
sync();
</script>
</body>
</html>
